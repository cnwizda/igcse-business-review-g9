  { id: "g4s5", type: "mcq", topic: "2.1", marks: 1, joe: true, q: "🥔 Joe says: <i>'A job description and a person specification are the same thing.'</i>", opts: ["True", "False"], a: 1, explain: "False. The description describes the job. The specification specifies the person. Mixing them up is the classic 2-mark loss." }
  ] },

{ n: 5, code: "918465", img: "students", topic: "2.1", title: "Question 2(b)", sub: "Promote Bilguun, or advertise outside?", book: "📖 Coursebook pp. 92-100",
  terms: ["internal recruitment", "external recruitment", "recruitment", "selection"],
  steps: [
  { id: "g5s1", type: "story", chip: "Question 2(b) · 12 marks", title: "The question", text: `<p class="q">BG needs a manager for its new kiosk. Consider the following <b>two</b> ways BG could recruit the manager:</p><p>• internal recruitment: promote Bilguun<br>• external recruitment: advertise on a jobs website</p><p class="q">Which way should BG choose? Justify your answer using Appendix 3. <b>[12]</b></p>` + APP3 },
  { id: "g5s2", type: "sort", topic: "2.1", marks: 2, q: "⚖️ Which route does each statement describe?", cats: ["Internal", "External"], items: [["Cheaper: no advert to pay for", 0], ["Faster: the person is already known", 0], ["A small choice of people", 0], ["New ideas and skills come in", 1], ["A wide choice of applicants", 1], ["Slower: strangers must be checked", 1]], explain: "[[internal recruitment]]: known people from a small pool. [[external recruitment]]: unknown people from a wide pool." },
  { id: "g5s3", type: "mcq", topic: "2.1", marks: 1, q: "Saraa wants to check what an applicant's old boss says about them. Which selection method is this?", opts: ["References", "A CV", "A test", "A job description"], a: 0, explain: "Selection methods: CV and application form, references, tests and interviews. A CV can make a person look better, so references check the story." },
  { id: "g5s4", type: "mcq", topic: "2.1", marks: 1, q: "If Bilguun is promoted, what new problem does BG have?", opts: ["His old job making drinks is empty and must be filled", "Bilguun must leave BG", "BG must pay 300,000₮ for an advert for the manager job", "Nobody at BG knows him"], a: 0, explain: "Internal recruitment moves the gap: the old job opens behind the promoted worker." },
  { id: "g5s5", type: "build", topic: "2.1", exam: true, cmd: "Consider", part: "Question 2(b) · step 1 of 2", label: "discuss · 6 of the 12", marks: 6, group: 3, tags: null, plainJoin: true, heads: ["Internal: promote Bilguun", "External: jobs website"],

  { id: "g5s6", type: "choice", chip: "Your advice", title: "What do you tell the sisters?", q: "Which way should BG choose?", conceptLabel: "Examiner's view:", opts: [
    { k: "A", t: "Internal: promote Bilguun", d: "Free and fast. No management experience.", set: { q2: "int" }, val: 1, out: "👤 Bilguun starts next week. The team is happy for him. In month one, the evening money count is wrong twice, so Saraa helps him.", concept: SAME },
    { k: "B", t: "External: advertise the job", d: "An experienced manager. Slower and not free.", set: { q2: "ext" }, val: 1, out: "🌍 After four weeks, Oyuna joins from a cafe. She runs the team well, but needs time to learn the recipes. Bilguun starts looking at other jobs.", concept: SAME }

  { id: "g5s7", type: "write", topic: "2.1", exam: true, cmd: "Justify", part: "Question 2(b) · step 2 of 2", label: "decide · 6 of the 12", marks: 6, q: "Which way should BG choose? Justify your answer using Appendix 3.", task: "Write your recommendation in your notebook: 4 to 6 sentences.",
    guide: ["Say your choice.", "Give your main reason. Use a fact from Appendix 3.", "Say why the other way is worse for BG.", "Finish with a condition: 'This will only work if...'"], frame: FRAME2, points: TICKS2, modelTitle: "Model recommendation for your choice",

{ n: 6, code: "354089", img: "survey", topic: "1.1-1.5", title: "Question 3(a)", sub: "Two calculations and four quick answers", book: "📖 Coursebook pp. 11-22 and pp. 71-86",

  { id: "g6s2", type: "num", topic: "1.1", exam: true, cmd: "Calculate", part: "Question 3(a)(i)", marks: 2, unit: "₮", q: "One cup sells for 9,500₮. The bought-in materials for one cup cost 3,500₮. Calculate BG's [[added value]] for one cup.", formula: "Added value = selling price − cost of bought-in materials", answer: 6000, explain: "9,500 − 3,500 = <b>6,000₮</b>." },
  { id: "g6s3", type: "num", topic: "1.5", exam: true, cmd: "Calculate", part: "Question 3(a)(ii)", marks: 2, unit: "%", table: { head: ["Bubble tea in Ulaanbaatar", "Sales (₮)"], rows: [["BG's sales", "600,000,000"], ["Total market sales", "5,000,000,000"]] }, q: "Calculate BG's [[market share]] last year.", formula: "Market share = (sales of the business ÷ total market sales) × 100", answer: 12, explain: "600,000,000 ÷ 5,000,000,000 × 100 = <b>12%</b>. Two years ago, it was 14%, so BG's share has fallen." },
  { id: "g6s4", type: "sort", topic: "1.5", marks: 2, q: "🏠 Internal or external [[stakeholder]] of BG?", cats: ["Internal", "External"], items: [["Nomin and Saraa (owners)", 0], ["Kiosk managers", 0], ["Employees", 0], ["Customers", 1], ["The tea supplier", 1], ["The bank", 1], ["The mall's neighbours (local community)", 1]], explain: "Three internal groups: owners, managers, employees. Five external groups: customers, suppliers, lenders, government, local community." },

{ n: 7, code: "147632", img: "meeting", topic: "1.4", title: "Question 3(b)", sub: "Partnership or private limited company?", book: "📖 Coursebook pp. 56-63",
  terms: ["private limited company", "limited liability", "shareholder", "partnership"],
  steps: [
  { id: "g7s1", type: "story", chip: "Question 3(b) · 12 marks", title: "The question", text: `<p class="q">The sisters' uncle will invest 40,000,000₮ if BG becomes a private limited company. Consider the following <b>two</b> options:</p><p>• BG stays a partnership<br>• BG becomes a private limited company</p><p class="q">Which option should BG choose? Justify your answer. <b>[12]</b></p>` + LEVELS12 },
  { id: "g7s2", type: "sort", topic: "1.4", marks: 2, q: "⚖️ Partnership or private limited company?", cats: ["Partnership", "Private limited company"], items: [["Unlimited liability", 0], ["Owned by partners", 0], ["Few legal documents to start", 0], ["Limited liability", 1], ["Owned by shareholders", 1], ["Can raise money by selling shares privately", 1]], explain: "A [[private limited company]] gives [[limited liability]] and can sell shares to people it chooses. The price: more paperwork and shared control." },
  { id: "g7s3", type: "num", topic: "1.4", marks: 2, unit: "₮", q: "BG has saved 60,000,000₮. The uncle would invest 40,000,000₮. How much money would BG have in total?", formula: "Total = savings + new investment", answer: 100000000, explain: "60,000,000 + 40,000,000 = <b>100,000,000₮</b>. That is enough to buy Mango Cup (90,000,000₮) with no bank loan." },
  { id: "g7s4", type: "mcq", topic: "1.4", marks: 1, q: "The uncle invests 40,000,000₮ in BG as a private limited company. BG later fails with large debts. What is the most the uncle can lose?", opts: ["40,000,000₮: his investment", "His home and all his savings", "Nothing", "Only the sisters' savings"], a: 0, explain: "Limited liability caps a [[shareholder]]'s loss at the amount invested. This is why the uncle will not join a partnership." },
  { id: "g7s5", type: "build", topic: "1.4", exam: true, cmd: "Consider", part: "Question 3(b) · step 1 of 2", label: "discuss · 6 of the 12", marks: 6, group: 3, tags: null, plainJoin: true, heads: ["Stay a partnership", "Become a private limited company"],
    q: "Consider the two options for BG's legal form.", intro: "For each option: a point FOR, a point AGAINST and the money.",
    slots: [
      { label: "✅ A point for", opts: ["The two sisters keep all the control and all the profit, with fewer legal documents", "Partnerships are friendly", "The sisters get limited liability"] },
      { label: "⚠️ A point against", opts: ["The sisters have unlimited liability, which is more dangerous if BG borrows 30,000,000₮ to grow", "It is old", "A partnership can have only one owner"] },
      { label: "🔢 The money", opts: ["BG has only its 60,000,000₮ savings, because the uncle will not invest in a partnership", "It has some money", "The uncle invests 40,000,000₮ in the partnership"] },
      { label: "✅ A point for", opts: ["The owners get limited liability, so they can lose only the money they invested", "Companies are big", "The company can sell shares on the stock exchange"] },
      { label: "⚠️ A point against", opts: ["The uncle becomes a shareholder, so the sisters must share the profit and agree big decisions with him", "It is new", "The sisters must give all the profit to the government"] },
      { label: "🔢 The money", opts: ["60,000,000₮ + 40,000,000₮ = 100,000,000₮, enough to buy Mango Cup (90,000,000₮) with no loan", "It has more money", "60,000,000₮ + 40,000,000₮ = 64,000,000₮, not enough for one kiosk"] }
    ], explain: "Careful: only a <b>public</b> limited company can sell shares on the stock exchange. A private limited company sells shares privately, for example to an uncle.", copy: "Copy one 'for' and one 'against' for each option into your notebook." },
  { id: "g7s6", type: "choice", chip: "Your advice", title: "What do you tell the sisters?", q: "Which option should BG choose?", conceptLabel: "Examiner's view:", opts: [
    { k: "A", t: "Stay a partnership", d: "Full control. Less money.", set: { q3: "stay" }, val: 1, out: "🤝 The sisters stay the only owners. They open one kiosk with their savings. The uncle keeps his 40,000,000₮ in the bank.", concept: SAME },
    { k: "B", t: "Become a private limited company", d: "More money and limited liability. Shared control.", set: { q3: "ltd" }, val: 1, out: "🏢 Boba Ger LLC is born. With 100,000,000₮, growth is fast. At the first shareholders' meeting, the uncle has many opinions about the menu.", concept: SAME }
  ] },
  { id: "g7s7", type: "write", topic: "1.4", exam: true, cmd: "Justify", part: "Question 3(b) · step 2 of 2", label: "decide · 6 of the 12", marks: 6, q: "Which option should BG choose? Justify your answer.", task: "Write your recommendation in your notebook: 4 to 6 sentences.",
    guide: ["Say your choice.", "Give your main reason. Use a number from the case.", "Say why the other option is worse for BG.", "Finish with a condition: 'This will only work if...'"], frame: FRAME2, points: TICKS2, modelTitle: "Model recommendation for your choice",
    model: S => ({
      stay: "<p>BG should stay a partnership. Nomin and Saraa keep all the control and all of the 80,000,000₮ profit, and they already disagree about BG's objective, so a third owner would make decisions even slower. BG's 60,000,000₮ savings can still pay for one new kiosk (40,000,000₮) with no loan.</p><p>Becoming a company is worse because the uncle becomes a shareholder: the sisters must share the profit and agree big decisions with him.</p><p>However, the sisters keep unlimited liability. This will only work if BG grows slowly and does not borrow large amounts.</p>",
      ltd: "<p>BG should become a private limited company. The uncle's 40,000,000₮ and BG's 60,000,000₮ make 100,000,000₮, so BG could buy Mango Cup (90,000,000₮) with no bank loan and no interest. The sisters also get limited liability, so their own homes and savings are safe if a new kiosk fails.</p><p>Staying a partnership is worse because BG has only 60,000,000₮, so it can open just one kiosk or must borrow 30,000,000₮ with unlimited liability.</p><p>However, the uncle becomes a shareholder. This will only work if the three owners agree how to share the profit and who makes the daily decisions.</p>"
    })[S.vars.q3 || "ltd"], rules: RULES_B }
  ] },

{ n: 8, code: "790521", img: "online", topic: "1.5", title: "Question 4(a)", sub: "Your turn to write: two stakeholder groups", book: "📖 Coursebook pp. 79-86",
  terms: ["stakeholder", "takeover", "profit", "objective"],
  steps: [
  { id: "g8s1", type: "story", chip: "Question 4(a) · 8 marks", title: "The question", text: `<p class="q">Explain how <b>two</b> stakeholder groups of BG could be affected if BG takes over Mango Cup. <b>[8]</b></p><p>✍️ This time, <b>you</b> write the answer.</p><div class="data"><div>✅ 1 mark for each stakeholder group and how it is affected [k]</div><div>✅ Up to 3 marks for explaining each one</div><div>📄 Use the case at least once in each [app]</div></div><p>📄 From the case: Mango Cup has 2 kiosks and costs 90,000,000₮. BG has saved 60,000,000₮.</p>` },
  { id: "g8s2", type: "sort", topic: "1.5", marks: 2, q: "👥 Match each objective to the stakeholder group.", cats: ["Owners", "Employees", "Customers", "Lenders", "Local community"], items: [["Profit and a safe investment", 0], ["Secure jobs and fair pay", 1], ["Good drinks at fair prices", 2], ["The loan is repaid with interest", 3], ["Jobs nearby and clean, quiet streets", 4]], explain: "Each group has its own objective. One decision can help one group and hurt another." },
  { id: "g8s3", type: "mcq", topic: "1.5", marks: 1, q: "After the takeover, BG raises prices at the two old Mango Cup kiosks. Which two groups are in conflict?", opts: ["Owners, who want profit, and customers, who want fair prices", "Suppliers and the government", "Employees and lenders", "Nobody: everyone wins"], a: 0, explain: "A conflict is one decision that serves one group's objective and blocks another's. Name both groups." },
  { id: "g8s4", type: "write", topic: "1.5", exam: true, cmd: "Explain", part: "Question 4(a)", marks: 8, q: "Explain how <b>two</b> stakeholder groups of BG could be affected if BG takes over Mango Cup.", task: "Write your full answer in your notebook: about 6 sentences.",
    guide: ["Group 1: name the group and how it is affected [k]. Use the case [app]. Then 'so...' and 'so...' [an].", "Group 2: a different group, the same four moves.", "TWO groups only. Depth, not a list."],
    frame: ["One group is ... They could be affected because ...", "In the case, ..., so ...", "This means ...", "A second group is ... They could be affected because ...", "In the case, ..., so ...", "This means ..."],
    points: [
      { tag: "k", t: "Group 1 is a real stakeholder group, and I said how it is affected (e.g. owners: more profit or more risk; employees: new jobs or changes; customers: more kiosks; lenders: a new loan)." },
      { tag: "app", t: "It uses the case (2 kiosks; 90,000,000₮; 60,000,000₮ saved; the 30,000,000₮ loan; Cha Cha Tea; unlimited liability)." },
      { tag: "an", t: "It has a first 'so...'." }, { tag: "an", t: "It has a second 'so...' that goes further." },
      { tag: "k", t: "Group 2 is a different stakeholder group, and I said how it is affected." },
      { tag: "app", t: "It uses the case." },
      { tag: "an", t: "It has a first 'so...'." }, { tag: "an", t: "It has a second 'so...' that goes further." }
    ],
    model: "<p><b>Owners:</b> Nomin and Saraa take a bigger risk [k]. Mango Cup costs 90,000,000₮ but they have saved only 60,000,000₮ [app], so BG must borrow 30,000,000₮ and pay interest [an]. As partners, they have unlimited liability, so they could lose their own savings if the two new kiosks fail [an].</p><p><b>Customers:</b> customers get more places to buy BG drinks [k]. BG would have 5 kiosks, not 3 [app], so more customers have a BG kiosk near them [an]. However, with one rival less, BG could raise its prices, so customers may pay more than 9,500₮ a cup [an].</p>",
    rules: ["1 mark for each stakeholder group with a correct effect: 2 marks.", "Up to 3 marks for explaining each one. At least one of them must use the case.", "A list of five groups earns no extra marks. Explain TWO fully."] },
  { id: "g8s5", type: "mcq", topic: "1.5", marks: 1, joe: true, q: "🥔 Joe says: <i>'Only the owners are affected by a business decision.'</i>", opts: ["True", "False"], a: 1, explain: "False. Employees, customers, lenders, suppliers, the government and the local community all have an interest in what BG does." }
  ] },

{ n: 9, code: "526874", img: "shop", topic: "1.5", title: "Question 4(b)", sub: "The full 12 marks. Pen ready.", book: "📖 Coursebook pp. 71-78",
  terms: ["objective", "survival", "market share", "profit"],
  steps: [
  { id: "g9s1", type: "story", chip: "Question 4(b) · 12 marks", title: "The last question", text: `<p class="q">The sisters must agree on BG's main objective for next year. Consider the following <b>three</b> objectives:</p><p>• higher profit<br>• growth<br>• higher market share</p><p class="q">Which objective should BG choose? Justify your answer. <b>[12]</b></p><p>✍️ This time, you write the <b>whole</b> answer. First, two warm-ups.</p>` + `<h3 style="margin:10px 0 4px">From the case</h3><p>• BG's profit last year: 80,000,000₮<br>• Market share: 14% two years ago, 12% last year<br>• Cha Cha Tea: 5 shops, lower prices, 15% market share<br>• BG's savings: 60,000,000₮. A new kiosk: 40,000,000₮</p>` },
  { id: "g9s2", type: "sort", topic: "1.5", marks: 2, q: "🎯 Which objective is each target?", cats: ["Profit", "Growth", "Market share"], items: [["Earn 100,000,000₮ next year, not 80,000,000₮", 0], ["Keep the price at 9,500₮ and cut costs", 0], ["Open two new kiosks", 1], ["Start selling in Darkhan", 1], ["Win back customers from Cha Cha Tea", 2], ["Sell 14% of all bubble tea in Ulaanbaatar again", 2]], explain: "Profit, growth and [[market share]] are common objectives. They can pull in different directions." },
  { id: "g9s3", type: "mcq", topic: "1.5", marks: 1, q: "BG cuts its price to 8,500₮ to win customers from Cha Cha Tea. What is the likely effect?", opts: ["Market share may rise, but profit on each cup falls", "Market share and profit per cup both rise for certain", "Nothing changes", "BG's costs fall"], a: 0, explain: "Chasing market share may cost profit: a lower price wins customers but cuts the margin on every cup." },
  { id: "g9s4", type: "story", chip: "Idea menu", title: "Ideas you can use", text: `<p>📓 Pick ideas from this menu. Add facts from the case.</p><div class="data"><div><b>💰 Higher profit</b></div><div>✅ Profit pays for future kiosks and rewards the sisters' risk. Last year: 80,000,000₮.</div><div>⚠️ High prices may push more customers to Cha Cha Tea, which is cheaper.</div></div><div class="data"><div><b>🚀 Growth</b></div><div>✅ More kiosks mean more sales. BG has 60,000,000₮ saved.</div><div>⚠️ A new kiosk costs 40,000,000₮, so profit is low this year.</div></div><div class="data"><div><b>📊 Higher market share</b></div><div>✅ BG's share fell from 14% to 12%. Cha Cha Tea now has 15%.</div><div>⚠️ Lower prices win customers but cut the profit on each cup.</div></div>` },
  { id: "g9s5", type: "write", topic: "1.5", exam: true, cmd: "Justify", part: "Question 4(b)", marks: 12, q: "Consider the three objectives: higher profit, growth and higher market share. Which objective should BG choose for next year? Justify your answer.", task: "Write your full answer in your notebook: three short paragraphs and a decision.",
    guide: ["Paragraph 1: objective 1. One point for, one point against, with the case.", "Paragraph 2: objective 2. The same.", "Paragraph 3: objective 3. The same.", "Decision: your choice, your best reason and why the others are worse."],
    frame: ["Higher profit would ... because ... However, ...", "Growth would ... because ... However, ...", "Higher market share would ... because ... However, ...", "BG should choose ... because ...", "This is better than ... because ..."],
    levels: [[12, "Level 3: all three objectives discussed with the case + a clear choice + strong reasons + why the others are worse."], [10, "Level 3: two objectives discussed in detail with the case + a choice with good reasons."], [8, "Level 2: two objectives discussed with the case + a choice with a simple reason."], [6, "Level 2: one objective discussed in detail with the case + a choice."], [4, "Level 1: simple points about all three objectives, using the case."], [2, "Level 1: one or two simple points. No case."], [0, "Nothing correct, or nothing written."]],
    model: "<p><b>Higher profit</b> rewards Nomin and Saraa for their risk, and it pays for future kiosks. Last year's profit was 80,000,000₮. However, keeping prices high may push more customers to Cha Cha Tea, which is cheaper.</p><p><b>Growth</b> means more kiosks and more sales, and BG has 60,000,000₮ saved. However, one new kiosk costs 40,000,000₮, so profit would be low next year, and the sisters would have less money if something goes wrong.</p><p><b>Higher market share</b> matters because BG's share fell from 14% to 12% while Cha Cha Tea reached 15%. However, winning customers back with lower prices cuts the profit on every cup.</p><p><b>Decision:</b> BG should choose higher market share. Its biggest problem is Cha Cha Tea: if BG keeps losing customers, profit and growth will both fall later. It is better than higher profit, because high prices help the rival, and better than growth, because new kiosks are risky while customers are leaving. BG should not just cut prices: it should also use its brand and recipes to win customers back.</p>",

<script>
const KEY = GAME.key;
const MASTER = GAME.master;
let S = load() || fresh();
let ui = {};
let AC = null;
function tone(freqs, dur, type, vol){ if (S.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime; freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * dur); g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + i * dur + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur + 0.15); o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.2); }); } catch (e) {} }
const ding = () => tone([880, 1320], 0.09, "sine", 0.06), thud = () => tone([196], 0.14, "triangle", 0.05), fanfare = () => tone([523, 659, 784, 1047], 0.1, "sine", 0.05);
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:Object.assign({}, GAME.vars0 || {}), res:{}, master:false, mute:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sub(t){ return String(t).replace(/\{B\}/g, esc(S.vars.brand || "your business")).replace(/\{N\}/g, esc(S.name || GAME.roleName || "Founder")); }
function gl(html){
  return sub(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const [term, label] = w.split("|");
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === term.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${label || term}</span>` : (label || term);
  }).replace(/\[(k|app|an|eval)\]/g, (m, t) => `<span class="tag ${t}">${t}</span>`);
}
function rng(seed){ let h = 2166136261; for (const c of seed) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 100000) / 100000; }; }
function shuffled(arr, seed){ const r = rng(seed); const idx = arr.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return idx; }
function parseNum(t){ if (t == null) return NaN; t = String(t).trim().toLowerCase().replace(/₮|tugrik|tögrög|mnt|packs?|points?|units?|hoodies?|cups?|bags?|bottles?|people|students?|customers?|workers?|,|%|\s/g, ""); let mult = 1; if (/(billion|bn)$/.test(t)) { mult = 1e9; t = t.replace(/(billion|bn)$/, ""); } else if (/(million|m)$/.test(t)) { mult = 1e6; t = t.replace(/(million|m)$/, ""); } return parseFloat(t) * mult; }
function close(x, ans){ if (isNaN(x)) return false; const tol = Math.max(Math.abs(ans) * 0.005, 0.01); return [1, 1e6, 1e9].some(k => Math.abs(x * k - ans) <= tol); }

function ch(){ return CHAPTERS[S.ch]; }
function step(){ return ch().steps[S.step]; }
function addVal(d){ S.val = Math.round((S.val + d) * 10) / 10; }
function record(st, earned, extra){ S.res[st.id] = Object.assign({ done:true, earned, max: st.marks || 0, topic: st.topic, ch: S.ch }, extra || {}); addVal(earned); save(); render(); }

function header(){
  $("brand").innerHTML = GAME.brand;
  $("val").textContent = (GAME.valIcon || "🥟") + " " + fmt(S.val) + (GAME.valUnit === undefined ? "M₮" : GAME.valUnit); $("casebtn").style.display = GAME.caseFile && S.screen !== "start" ? "" : "none"; $("mutebtn").textContent = S.mute ? "🔇" : "🔊";
  $("dots").innerHTML = CHAPTERS.map((c, i) => `<i class="${i < S.ch || (S.screen === "report") ? "done" : i === S.ch && S.screen !== "start" ? "cur" : ""}"></i>`).join("");
}
function chips(st){
  let h = `<div class="chips"><span class="chip topic">${st.topic === "Final" ? (GAME.finalLabel || "Paper 1") : st.topic}</span>`;
  if (st.exam && st.cmd) h += `<span class="chip exam">📝 ${st.part || "Exam part"}</span><span class="chip animal">${CMD[st.cmd].animal} · ${st.cmd} · ${st.label || "[" + st.marks + "]"}</span>`;
  else h += `<span class="chip">Quick check · ${st.marks} pt${st.marks === 1 ? "" : "s"}</span>`;
  if (st.joe) h += `<span class="chip joe">🥔 Joe says</span>`;
  let x = h + "</div>";
  if (st.exam && st.cmd) x += `<p class="small" style="margin:-4px 0 8px">${st.cmd} = ${CMD[st.cmd].means}.</p>`;
  return x;
}
function heroFor(c){
  const im = IMG[c.img];
  return `<div class="hero">${im ? `<img src="${im}" alt="">` : ""}<div class="cap"><div class="chn">${c.n === CHAPTERS.length && GAME.lastWord !== null ? (GAME.lastWord || "Finale") : (GAME.chapterWord || "Chapter") + " " + c.n} · ${c.topic === "Final" ? (GAME.finalLabel || "Paper 1") : c.topic}</div><h1>${c.title}</h1><div class="sub">${c.sub}</div></div></div>${CREDITS[c.img] ? `<div class="credit">Photo: ${CREDITS[c.img]}</div>` : ""}${c.book ? `<div class="book">${c.book}</div>` : ""}`;
}
function nextBtn(label){ return `<div class="row"><button class="btn" data-act="next">${label || "Continue →"}</button></div>`; }

let lastKey = "";
function render(){
  header();
  const app = $("app");
  const key = S.screen + "|" + S.ch + "|" + S.step;
  if (key !== lastKey) { lastKey = key; app.classList.add("anim"); window.scrollTo(0, 0); } else app.classList.remove("anim");
  if (S.screen === "start") return app.innerHTML = startScreen();
  if (S.screen === "gate") return app.innerHTML = gateScreen();
  if (S.screen === "end") return app.innerHTML = endScreen();
  if (S.screen === "report") return app.innerHTML = reportScreen();
  const c = ch(), st = step();
  app.innerHTML = heroFor(c) + renderStep(st);
}

function startScreen(){
  return `<div class="hero">${IMG.cover ? `<img src="${IMG.cover}" alt="">` : ""}<div class="cap"><div class="chn">${GAME.kicker}</div><h1>${GAME.title}</h1><div class="sub">${GAME.sub}</div></div></div>${CREDITS.cover ? `<div class="credit">Photo: ${CREDITS.cover}</div>` : ""}
<div class="card"><h2>How to play</h2>${GAME.howto}
<p>📖 Tap any <span class="term" data-act="term" data-term="${GAME.demoTerm}">underlined word</span> to see what it means.</p></div>
<div class="card"><h2>Your name</h2><p class="small">First name only. It stays on this device.</p>
<input class="num" id="nm" maxlength="24" placeholder="e.g. Temuulen" value="${esc(S.name)}">

function showScore(){ const x = totals(); $("pop").innerHTML = `<div class="pop" style="text-align:center"><b>${esc(S.name || GAME.roleName || "Founder")}</b> · ${esc(S.vars.brand || "")}<div class="scorebig" style="margin:8px 0">${fmt(x.xe + x.e)} / ${x.xm + x.m}</div><p class="small">Score so far · reached ${GAME.chapterWord || "Chapter"} ${S.ch + 1} of ${CHAPTERS.length}<br>Exam parts ${fmt(x.xe)} of ${x.xm} · Quick checks ${fmt(x.e)} of ${x.m}</p><div class="row" style="justify-content:center"><button class="btn" data-act="popclose">Close</button></div></div>`; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "myscore") return showScore();
  if (a === "case") return showCase();
  if (a === "mute") { S.mute = !S.mute; save(); return header(); }
  if (a === "key") {
    const k = b.dataset.k; ui.code = ui.code || ""; ui.codeErr = false;
    if (k === "⌫") ui.code = ui.code.slice(0, -1);
    else if (k === "✓") {
      if (ui.code === MASTER) S.master = true;
      if (ui.code === ch().code || ui.code === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); fanfare(); return render(); }
      ui.codeErr = true; ui.code = ""; thud();
    } else if (ui.code.length < 6) ui.code += k;
    return render();
  }
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
</body>
