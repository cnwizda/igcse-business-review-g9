<style>

.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;min-width:80px}

.g{background:var(--teal)}.a{background:var(--gold)}.r{background:var(--red)}

ol.model{padding-left:18px}ol.model li{margin:6px 0}
.cert{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;margin:0 2px;vertical-align:1px}
.tag.k{background:#60A5FA;color:#0B1220}.tag.app{background:#F5B841;color:#0B1220}.tag.an{background:#2DD4BF;color:#0B1220}.tag.eval{background:#FF6B4A;color:#0B1220}
.chip.animal{color:#0B1220;background:#F5B841;border-color:#F5B841}
.chip.joe{color:#0B1220;background:#c8a06a;border-color:#c8a06a}
.chip.exam{color:#fff;background:#7c3aed;border-color:#7c3aed}

.codebox{display:flex;justify-content:center;gap:8px;margin:8px 0}
.codebox span{width:40px;height:50px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-size:26px;color:var(--gold)}
.codebox span.f{border-color:var(--gold)}
.ticks label{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}

.ticks input{width:22px;height:22px;flex:none;margin-top:1px}
.rules{font-size:14px;color:#F7D488;background:#2a2410;border:1px solid #5b4a1f;border-radius:10px;padding:8px 12px;margin:10px 0}
.rules li{margin:3px 0}
.book{font-size:13px;color:var(--teal);margin:-2px 0 10px}
.mute{background:none;border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.pop.case{top:64px;bottom:12px;overflow:auto;-webkit-overflow-scrolling:touch}.pop.case h3{margin:14px 0 4px;color:var(--gold);font-size:16px}.pop.case p{margin:6px 0;font-size:15px}.grp{border-left:3px solid var(--gold);padding-left:10px;margin:14px 0 4px;font-weight:700;color:var(--gold)}
.scorebig{font-size:54px;font-weight:800;color:var(--gold);font-family:Cambria,Georgia,serif;line-height:1}
.cert .name{font-family:Cambria,Georgia,serif;font-size:26px}
.path li{margin:4px 0}
footer.cr{color:var(--muted);font-size:11px;margin-top:24px}
@media (prefers-reduced-motion:no-preference){.anim .card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>

<script>
// Shared glossary and command words for the IGCSE Business 0264 review games. All businesses and figures are fictional.
const GLOSSARY = {

  "factors of production": "The resources a business needs to make goods or services: land, labour, capital and enterprise.",

  "public sector": "Businesses and services owned and run by the government.",
  "private sector": "Businesses owned and run by individuals or companies, not the government.",

  "job description": "A document that describes the job: title, duties, hours and pay.",
  "person specification": "A document that describes the ideal person for the job: skills, qualifications, experience and qualities.",
  "induction training": "Training on a worker's first days: rules, safety and how the business works.",
  "on-the-job training": "Training at the workplace, by watching and working next to an experienced worker.",
  "off-the-job training": "Training away from the workplace, for example at a college or on a course.",
  "span of control": "The number of workers who report directly to one manager.",
  "chain of command": "The line of authority from the top of the business to the bottom.",
  "delegation": "A manager gives a worker the authority to do a task.",
  "autocratic leadership": "The leader makes all the decisions alone.",

  "laissez-faire leadership": "The leader lets workers make most decisions themselves.",
  "jargon": "Special technical words that people outside a job may not understand. A communication barrier.",

  "secondary research": "Information that already exists, collected by someone else.",
  "sample": "A small group of people who are asked in market research, chosen to represent the whole market.",
  "brand image": "What customers think and feel about a brand.",
  "product life cycle": "The stages a product goes through: introduction, growth, maturity and decline.",
  "extension strategy": "An action to stop sales falling and make a product's life longer.",
  "cost-plus pricing": "The price is the cost per unit plus a percentage mark-up for profit.",
  "penetration pricing": "A low price at the start to win customers and market share quickly.",

  "competitive pricing": "A price close to the prices of competitors.",
  "dynamic pricing": "The price changes often, with demand. For example, higher at busy times.",
  "sales promotion": "Short-term offers to increase sales, such as buy one get one free.",
  "labour productivity": "The output per worker in a period of time. Output ÷ number of workers.",

  "total cost": "Fixed costs + variable costs.",
  "average cost": "Total cost ÷ output. The cost of one unit.",
  "economies of scale": "The average cost per unit falls as a business grows bigger.",
  "diseconomies of scale": "The average cost per unit rises because the business has grown too big.",

Object.assign(GLOSSARY, {

  "scarcity": "There are not enough resources to make everything people want.",

  "market research": "Collecting information about customers, competitors and the market."
});

Object.assign(GLOSSARY, {

  "horizontal integration": "Two businesses at the same stage of production join, for example two hoodie brands.",

    { label: "Advantage: name it [k]", opts: ["Growth is fast: the business gets workers, machines and customers at once", "It costs nothing", "The owner keeps full control with no changes"] },
    { label: "Advantage: use the case [app]", opts: ["Nomad Threads has 12 employees and sells 350 hoodies a month", "takeovers are a type of growth", "Nomad Threads has no workers or customers"] },
    { label: "Advantage: say why, so... [an]", opts: ["so {B}'s sales almost double in one day, and it has one rival less", "so it is good", "because takeover means buying"] },
    { label: "Disadvantage: name it [k]", opts: ["It is expensive, and two different teams are hard to manage", "It is very slow", "It makes the business smaller"] },
    { label: "Disadvantage: use the case [app]", opts: ["Nomad Threads costs 50,000,000₮, and {B} has only 5 employees of its own", "businesses have costs", "Nomad Threads is free"] },
    { label: "Disadvantage: say why, so... [an]", opts: ["so {B} must borrow money, and the interest lowers its profit", "so it is bad", "because Nomad Threads is a rival"] }
  ], explain: "Explain = 3 marks per point: [k] + [app] + [an]. This takeover is [[horizontal integration]]: two businesses at the same stage." }

{ n: 7, code: "651290", img: "handshake", topic: "1.4", title: "Make It Legal", sub: "Sole traders, partnerships and limited companies", book: "📖 Coursebook pp. 56-63",
  terms: ["sole trader", "partnership", "private limited company", "limited liability"],
  steps: [
  { id: "h7s1", type: "story", title: "Who owns {B}?", text: `<p>🏦 The bank asks one more question: <i>"Who owns this business?"</i></p><p>🎨 Anu wants to be an owner. Your uncle Bold has savings and wants to invest too.</p><p>🧑‍🏫 Mr. Chris: <i>"Choose carefully. If the business cannot pay its debts, who pays?"</i></p>` },
  { id: "h7s2", type: "sort", topic: "1.4", marks: 2, q: "⚖️ [[unlimited liability|Unlimited]] or [[limited liability|limited]] liability?", cats: ["Unlimited liability", "Limited liability"], items: [["Sole trader", 0], ["Partnership", 0], ["Private limited company", 1], ["Public limited company", 1]], explain: "Unlimited: the owners' own things can be taken to pay business debts. Limited: owners can lose only the money they invested." },
  { id: "h7s3", type: "num", topic: "1.4", marks: 2, unit: "₮", q: "Imagine {B} is a private limited company. You invested 5,000,000₮ in shares. The company fails and owes 20,000,000₮. What is the most that <b>you</b> can lose?", formula: "Limited liability: maximum loss = the amount invested", answer: 5000000, explain: "<b>5,000,000₮</b>: your investment, never your home. The company still owes the 20,000,000₮. Limited liability protects the shareholder, not the company." },
  { id: "h7s4", type: "choice", title: "Choose your legal form", q: "What legal form will {B} have?", opts: [
    { k: "A", t: "Sole trader", d: "You own it all. Quick decisions. Unlimited liability.", set: { entity: "sole" }, val: 1, out: "🧾 You keep control and all the profit. Anu works for you. If {B} fails, you could lose your own savings.", concept: "A [[sole trader]] has [[unlimited liability]] and must find all the money alone." },
    { k: "B", t: "Partnership with Anu", d: "Share work, ideas and profit. Both have unlimited liability.", set: { entity: "partner" }, val: 1, out: "🤝 Anu brings her designs and 5,000,000₮. You share decisions and profit. Sometimes you disagree.", concept: "A [[partnership]] brings more money and skills, but partners share profit and have [[unlimited liability]]." },
    { k: "C", t: "Private limited company", d: "You, Anu and Uncle Bold are shareholders. Limited liability. More paperwork.", set: { entity: "ltd" }, val: 1, out: "🏢 {B} LLC is registered. Your own things are safe, but there are more rules, and the three of you must agree on big decisions.", concept: "A [[private limited company]] gives [[limited liability]]. Its shares are sold privately, not to the public." }
  ], after: S => "📌 Remember this choice. It comes back in the final chapter." },
  { id: "h7s5", type: "mcq", topic: "1.4", marks: 1, q: "Which type of business can sell its shares to the public on a stock exchange?", opts: ["Public limited company", "Private limited company", "Partnership", "Sole trader"], a: 0, explain: "Only a [[public limited company]] can sell shares to the public. This is why it finds it easiest to raise finance." },
  { id: "h7s6", type: "order", topic: "1.4", marks: 2, q: "💰 Rank the four types: easiest to raise finance (1) to hardest (4).", items: ["Public limited company", "Private limited company", "Partnership", "Sole trader"], explain: "More owners and limited liability mean more finance. The price: less control for each owner." },
  { id: "h7s7", type: "write", topic: "1.4", exam: true, cmd: "Outline", marks: 4, q: "Anu wants to join you as a partner. Outline <b>two</b> advantages to {B} of being a partnership.",
    guide: ["Advantage 1 [k] + a fact about {B} [app].", "Advantage 2 [k] + a fact about {B} [app]."],
    points: [{ tag: "k", t: "Advantage 1 is correct (e.g. more capital; more skills and ideas; shared workload; shared decisions and risk)." }, { tag: "app", t: "It uses a fact about {B} (e.g. Anu's designs; her 5,000,000₮; the printing machine; the class orders)." }, { tag: "k", t: "Advantage 2 is a different correct advantage." }, { tag: "app", t: "It uses a fact about {B}." }],
    model: "<p>1. A partner brings more capital [k]: Anu can add 5,000,000₮ toward the printing machine [app].</p><p>2. Partners bring different skills [k]: Anu draws the designs while you manage the orders [app].</p>",
    rules: ["Outline: 1 mark [k] + 1 mark [app] for each advantage.", "'Limited liability' is wrong here: partners have unlimited liability."] }
  ] },

{ n: 8, code: "286537", img: "online", topic: "1.4", title: "Brands Working Together", sub: "Franchises, joint ventures and social enterprises", book: "📖 Coursebook pp. 64-70",
  terms: ["franchise", "franchisor", "franchisee", "joint venture"],
  steps: [
  { id: "h8s1", type: "story", title: "Three phone calls", text: `<p>📞 Call 1: a shop owner in Erdenet wants to open a {B} shop, using your name and designs.</p><p>📞 Call 2: a Korean clothing firm wants to make one K-pop hoodie collection with you.</p><p>📞 Call 3: Anu wants {B} to give warm hoodies to children in need.</p><p>🧑‍🏫 Mr. Chris: <i>"Three calls, three ways of working. Name them."</i></p>` },
  { id: "h8s2", type: "mcq", topic: "1.4", marks: 1, q: "The shop owner in Erdenet pays {B} to use the {B} name and designs. The shop owner is the...", opts: ["Franchisee", "Franchisor", "Shareholder", "Sole trader of {B}"], a: 0, explain: "The -or gives, the -ee receives. {B} is the [[franchisor]]. The shop owner is the [[franchisee]]." },
  { id: "h8s3", type: "sort", topic: "1.4", marks: 2, q: "🏷️ Franchisor or franchisee?", cats: ["Franchisor (you)", "Franchisee (the shop)"], items: [["Owns the brand and the designs", 0], ["Gives training and advertising", 0], ["Pays a fee and a royalty", 1], ["Runs the shop and takes its risks", 1]], explain: "A [[franchise]] is the right to trade under another business's name and system." },
  { id: "h8s4", type: "num", topic: "1.4", marks: 2, unit: "₮", q: "The Erdenet shop pays {B} a [[royalty]] of 10% of its sales. Its sales are 8,000,000₮ a month. How much does {B} receive each month?", formula: "Royalty = sales × royalty %", answer: 800000, explain: "8,000,000 × 10% = <b>800,000₮</b> a month. The royalty is a share of sales, not profit, so it is paid even in a month when the shop makes a loss." },
  { id: "h8s5", type: "mcq", topic: "1.4", marks: 1, q: "{B} and the Korean firm make one hoodie collection together. They share the cost, the risk and the profit. What is this?", opts: ["A joint venture", "A takeover", "A franchise", "A public limited company"], a: 0, explain: "A [[joint venture]]: two businesses set up one project together and share cost, risk, profit and skills." },
  { id: "h8s6", type: "mcq", topic: "1.4", marks: 1, q: "A hoodie brand uses most of its profit to give warm clothes to children in need. What type of business is it?", opts: ["A social enterprise", "A public limited company", "A franchise", "A joint venture"], a: 0, explain: "A [[social enterprise]] has a social or environmental aim. It still needs to earn money, but profit is not its only goal." },
  { id: "h8s7", type: "mcq", topic: "1.4", marks: 1, joe: true, q: "🥔 Joe says: <i>'A franchisee pays the royalty only in months when the shop makes a profit.'</i>", opts: ["True", "False"], a: 1, explain: "False. A royalty is a share of <b>sales</b>. It must be paid even in a losing month." },
  { id: "h8s8", type: "build", topic: "1.4", exam: true, cmd: "Explain", marks: 6, q: "Explain <b>one</b> advantage and <b>one</b> disadvantage to {B} of selling a franchise to the shop owner in Erdenet.", slots: [
    { label: "Advantage: name it [k]", opts: ["The business grows with little of its own money", "The franchisor gets all the shop's profit", "The franchisor runs the shop every day"] },
    { label: "Advantage: use the case [app]", opts: ["the Erdenet shop owner pays for the shop and pays {B} a 10% royalty", "franchises are popular", "{B} pays the Erdenet shop a royalty"] },
    { label: "Advantage: say why, so... [an]", opts: ["so {B} earns about 800,000₮ a month without opening its own shop", "so it is good", "because a franchise is a business"] },
    { label: "Disadvantage: name it [k]", opts: ["There is less control over quality", "The franchisor pays all the shop's costs", "The brand cannot be used in other cities"] },
    { label: "Disadvantage: use the case [app]", opts: ["the franchisee sells {B} hoodies far away in Erdenet, where you cannot check every day", "shops can be far away", "the franchisee works in your workshop"] },
    { label: "Disadvantage: say why, so... [an]", opts: ["so poor service in that shop could damage {B}'s name everywhere", "so it is bad", "because Erdenet is a city"] }
  ], explain: "Each point: [k] + [app] + [an] = 3 marks. Use facts about {B}, not about 'any business'." }
  ] },

{ n: 9, code: "839105", img: "students", topic: "1.5", title: "What Do We Want?", sub: "Business objectives and market share", book: "📖 Coursebook pp. 71-78",
  terms: ["objective", "survival", "market share", "profit"],
  steps: [
  { id: "h9s1", type: "story", title: "Two founders, two dreams", text: `<p>🎂 {B} is two years old. You survived! 🎉</p><p>🚀 Anu: <i>"Let's grow. More cities!"</i></p><p>💰 You: <i>"First, more profit."</i></p><p>🧑‍🏫 Mr. Chris: <i>"A business needs clear objectives. Without a target, how do you know if you are winning?"</i></p>` },
  { id: "h9s2", type: "mcq", topic: "1.5", marks: 1, q: "In its first year, which [[objective]] matters most for a new business like {B}?", opts: ["Survival", "Being the biggest brand in Asia", "Paying the highest wages in Mongolia", "Opening 50 shops"], a: 0, explain: "[[survival]] comes first for new businesses and for any business in trouble. Profit, growth and market share come later." },
  { id: "h9s3", type: "sort", topic: "1.5", marks: 2, q: "🎯 Which objective is each target?", cats: ["Survival", "Profit", "Growth", "Market share"], items: [["Just cover our costs this year", 0], ["Earn 5,000,000₮ more than last year", 1], ["Open a second workshop", 2], ["Sell 10% of all printed hoodies in Ulaanbaatar", 3]], explain: "Survival, profit, growth and [[market share]] are the common objectives. A business can have more than one." },
  { id: "h9s4", type: "mcq", topic: "1.5", marks: 1, q: "Why does {B} need clear objectives?", opts: ["They give decisions a direction, and a target to check success against", "The law says every business must have ten", "Objectives make costs disappear", "So that the workers have nothing to aim for"], a: 0, explain: "Objectives give direction, let owners see if the business is succeeding, and give managers and employees a target." },
  { id: "h9s5", type: "num", topic: "1.5", exam: true, cmd: "Calculate", marks: 2, unit: "%", table: { head: ["Last year", "Sales (₮)"], rows: [["{B}", "216,000,000"], ["All printed hoodies sold in Ulaanbaatar", "2,700,000,000"]] }, q: "Calculate {B}'s [[market share]].", formula: "Market share = (sales of the business ÷ total market sales) × 100", answer: 8, explain: "216,000,000 ÷ 2,700,000,000 × 100 = <b>8%</b>." },
  { id: "h9s6", type: "mcq", topic: "1.5", marks: 1, q: "Next year, {B}'s sales rise. But its rivals' sales rise even faster. What happens to {B}'s market share?", opts: ["It falls", "It rises", "It stays the same", "It becomes 100%"], a: 0, explain: "Market share measures your position against rivals. Sales can rise while share falls." },
  { id: "h9s7", type: "choice", title: "Your main objective", q: "Which objective will {B} follow next year?", opts: [
    { k: "A", t: "Profit", d: "Keep prices up. Watch every cost.", set: { aim: "profit" }, val: 1, out: "💰 Profit rises. You pay back part of the bank loan early. A rival wins some of your customers with lower prices.", concept: "Profit is the reward for the owners' risk, and it pays for future growth." },
    { k: "B", t: "Growth", d: "More workshops, more cities.", set: { aim: "growth" }, val: 1, out: "🚀 You open in Darkhan. Sales jump. Profit is small this year because the new workshop cost a lot.", concept: "Growth uses up the profit the owners could have taken today." },
    { k: "C", t: "Market share", d: "Cut prices to win customers from rivals.", set: { aim: "share" }, val: 1, out: "📊 You cut prices by 10%. Your share climbs from 8% to 11%. Each hoodie now earns you less.", concept: "Chasing market share may cost profit: lower prices win customers but cut the margin." }
  ] },
  { id: "h9s8", type: "write", topic: "1.5", exam: true, cmd: "Define", marks: 2, q: "Define <b>'market share'</b>.", guide: ["One sentence. Give the exact meaning.", "No example and no calculation needed."],
    levels: [[2, "Clear: one business's sales as a percentage (or proportion) of total sales in the market."], [1, "Some idea: for example 'how much of the market a business has'."], [0, "Only a calculation or an example, or not correct."]],
    model: "Market share is the sales of one business as a percentage of the total sales in the market. <b>(2)</b>",
    rules: ["Define: 2 marks for clear understanding, 1 mark for some understanding.", "Examples are not credited on a Define question."] }
  ] },

{ n: 10, code: "574612", img: "manager", topic: "1.5", title: "Who Wants What?", sub: "Stakeholders and their objectives", book: "📖 Coursebook pp. 79-86",
  terms: ["stakeholder", "objective", "private sector", "profit"],
  steps: [
  { id: "h10s1", type: "story", title: "Everyone has an opinion", text: `<p>🌙 A huge order arrives. You plan to run the printing machine all night.</p><p>😠 Your neighbours complain about the noise. Your workers ask for more pay for night work. The bank wants its money back on time.</p><p>🧑‍🏫 Mr. Chris: <i>"These are your stakeholders. They do not all want the same thing."</i></p>` },
  { id: "h10s2", type: "sort", topic: "1.5", marks: 2, q: "🏠 Internal or external [[stakeholder]]?", cats: ["Internal", "External"], items: [["Owners", 0], ["Managers", 0], ["Employees", 0], ["Customers", 1], ["Suppliers", 1], ["Lenders, such as the bank", 1], ["The government", 1], ["The local community", 1]], explain: "Three internal groups: owners, managers, employees. Five external groups: customers, suppliers, lenders, government, local community." },
  { id: "h10s3", type: "sort", topic: "1.5", marks: 2, q: "👥 Match each objective to the stakeholder.", cats: ["Customers", "Employees", "Lenders", "Government", "Local community"], items: [["Good hoodies at a fair price", 0], ["Secure jobs and fair pay", 1], ["The loan is repaid with interest", 2], ["Taxes are paid and jobs are created", 3], ["Quiet nights and clean streets", 4]], explain: "Each stakeholder group has its own objective. Owners want profit, growth and a safe investment." },
  { id: "h10s4", type: "mcq", topic: "1.5", marks: 1, q: "You raise prices by 20% to increase profit. Which two stakeholder groups are now in conflict?", opts: ["Owners, who want profit, and customers, who want fair prices", "Suppliers and the government", "Employees and lenders", "Nobody: everyone wins"], a: 0, explain: "A conflict is <b>one decision</b> that serves one group's objective and blocks another's. Name both groups." },
  { id: "h10s5", type: "mcq", topic: "1.5", marks: 1, joe: true, q: "🥔 Joe says: <i>'A stakeholder must own shares in the business.'</i>", opts: ["True", "False"], a: 1, explain: "False. Stakeholder and shareholder are different words. The neighbour who hears your machine at night is a stakeholder and owns no shares." },
  { id: "h10s6", type: "write", topic: "1.5", exam: true, cmd: "Identify", marks: 2, q: "Identify <b>two</b> external stakeholder groups of {B}.",
    guide: ["Identify = just name them. No explanation is needed.", "Only your first two answers count."],
    points: [{ tag: "k", t: "First answer is an external group (customers, suppliers, lenders or the bank, government, local community)." }, { tag: "k", t: "Second answer is a different external group." }],
    model: "1. Customers [k] &nbsp; 2. The local community [k]",
    rules: ["Identify: 1 mark each for the first two valid answers.", "Owners, managers and employees are internal: no marks here."] },
  { id: "h10s7", type: "write", topic: "1.5", exam: true, cmd: "Outline", marks: 4, q: "{B} plans to run its printing machine all night to finish a big order. Outline <b>two</b> ways the objectives of {B}'s stakeholder groups might conflict because of this plan.",
    guide: ["Conflict 1: name the two groups and what each wants [k]. Link it to the night printing [app].", "Conflict 2: two different groups [k] + the night printing [app]."],
    points: [{ tag: "k", t: "Conflict 1 names two groups with different objectives (e.g. owners want profit; the community wants quiet)." }, { tag: "app", t: "It uses the case (the machine runs all night; the big order; the noise; night pay)." }, { tag: "k", t: "Conflict 2 names a different pair of objectives (e.g. employees want fair pay and rest; owners want low costs)." }, { tag: "app", t: "It uses the case." }],
    model: "<p>1. The owners want the profit from the big order, but the local community wants quiet nights [k]: the printing machine is loud and would run all night [app].</p><p>2. Employees want fair pay and rest, but the owners want low costs [k]: workers ask for more pay for night work, which reduces the profit from the order [app].</p>",
    rules: ["Outline: 1 mark [k] + 1 mark [app] for each conflict.", "Name both groups. One group alone is not a conflict."] }
  ] },

{ n: 11, code: "390846", img: "interview", topic: "2.1", title: "We Are Hiring", sub: "The recruitment process and selection methods", book: "📖 Coursebook pp. 92-100",
  terms: ["job description", "person specification", "job advertisement", "selection"],
  steps: [
  { id: "h11s1", type: "story", title: "Help wanted", text: `<p>📦 Orders keep growing. You need <b>four print workers</b> and <b>one print manager</b>.</p><p>🤔 Where do you start? Not with the advert.</p><p>🧑‍🏫 Mr. Chris: <i>"Three documents, in a fixed order. Each one is written from the one before."</i></p>` },
  { id: "h11s2", type: "order", topic: "2.1", marks: 2, q: "🪜 Put the stages of the recruitment process in order, from first (1) to last (4).", items: ["Job description: what the job involves", "Person specification: the person needed", "Job advertisement: tell people about the job", "Selection: choose the best applicant"], explain: "Job description → person specification → job advertisement → [[selection]]. The order is part of the answer." },
  { id: "h11s3", type: "sort", topic: "2.1", marks: 2, q: "📄 Which document does each line belong in?", cats: ["Job description", "Person specification"], items: [["Job title: print worker", 0], ["Duties: print and pack hoodies", 0], ["Hours: 9:00 to 18:00", 0], ["Careful and patient", 1], ["Can use a computer", 1], ["One year of work experience", 1]], explain: "[[job description]] describes the <b>job</b>: duties and responsibilities. [[person specification]] specifies the <b>person</b>: qualifications, skills and qualities." },
  { id: "h11s4", type: "mcq", topic: "2.1", marks: 1, q: "Which belongs in a [[job advertisement]]?", opts: ["The job title, the main duties, the pay and how to apply", "The names of all the customers", "The owner's home address", "The secret designs for next season"], a: 0, explain: "The advert is written from the job description and the person specification. It tells people what the job is and how to apply." },
  { id: "h11s5", type: "sort", topic: "2.1", marks: 2, q: "🔎 Which selection method?", cats: ["CV or application form", "References", "Test", "Interview"], items: [["A written summary of education and work experience", 0], ["A message from the applicant's old boss", 1], ["The applicant prints one hoodie while you watch", 2], ["A face-to-face meeting with questions", 3]], explain: "Selection methods: CV and application form, references, tests and interviews. Most businesses use several." },
  { id: "h11s6", type: "mcq", topic: "2.1", marks: 1, q: "Why should {B} use a printing test as well as an interview?", opts: ["An interview shows who talks well. A test shows who can do the job", "A test is always cheaper than an interview", "The law says tests are required", "Interviews are not allowed for print workers"], a: 0, explain: "Each method covers another's weak spot. CVs can make people look better, so references check them. Interviews favor talkers, so tests watch doers." },
  { id: "h11s7", type: "mcq", topic: "2.1", marks: 1, joe: true, q: "🥔 Joe says: <i>'The person specification must be written before the job description.'</i>", opts: ["True", "False"], a: 1, explain: "False. You cannot describe the ideal person before you have described the job." },
  { id: "h11s8", type: "write", topic: "2.1", exam: true, cmd: "Define", marks: 2, q: "Define <b>'person specification'</b>.", guide: ["One sentence. Give the exact meaning.", "Careful: do not describe the job. Describe the person."],
    levels: [[2, "Clear: a document listing the qualifications, skills and qualities of the person needed for the job."], [1, "Some idea: for example 'it says who they want'."], [0, "Describes the job's duties (that is a job description), or not correct."]],
    model: "A person specification is a document that lists the qualifications, skills and qualities of the person needed to do a job. <b>(2)</b>",
    rules: ["Define: 2 marks for clear understanding, 1 mark for some understanding.", "Mixing it up with the job description is the classic 2-mark loss."] }
  ] },
// ───────────────────────── 12
{ n: 12, code: "718239", img: "chat", topic: "2.1", title: "Inside or Outside?", sub: "Internal and external recruitment", book: "📖 Coursebook pp. 92-100",
  terms: ["internal recruitment", "external recruitment", "recruitment", "person specification"],
  steps: [
  { id: "h12s1", type: "story", title: "Two people want one job", text: `<p>👤 <b>Temka</b>, your first helper, wants the print manager job. He knows your machine and every worker. He has never managed people.</p><p>🌍 <b>Zaya</b> answers your online advert. She managed a print shop for three years. She has never seen your workshop.</p><p>🧑‍🏫 Mr. Chris: <i>"Read each person against the person specification, not against their smile."</i></p>` },
  { id: "h12s2", type: "sort", topic: "2.1", marks: 2, q: "🚪 Internal or external recruitment?", cats: ["Internal", "External"], items: [["Promote Temka to print manager", 0], ["A notice on the workshop wall for current workers", 0], ["An advert on a jobs website", 1], ["A recruitment agency finds applicants", 1]], explain: "[[internal recruitment]] = from inside the business. [[external recruitment]] = from outside it." },
  { id: "h12s3", type: "sort", topic: "2.1", marks: 2, q: "⚖️ Which route does each statement describe?", cats: ["Internal", "External"], items: [["Cheaper: no advert to pay for", 0], ["Faster: the person is already known", 0], ["A small choice of people", 0], ["New ideas and skills come in", 1], ["A wide choice of applicants", 1], ["Slower: strangers must be checked", 1]], explain: "Inside: known people from a small pool. Outside: unknown people from a wide pool. An advantage of one is a disadvantage of the other." },
  { id: "h12s4", type: "mcq", topic: "2.1", marks: 1, q: "If Temka is promoted, what new problem appears?", opts: ["His old job is empty and must be filled", "He must leave the business", "The advert costs more", "Nobody knows him"], a: 0, explain: "Internal recruitment moves the gap: the old job opens behind the promoted worker." },
  { id: "h12s5", type: "choice", title: "Who gets the job?", q: "Who will be {B}'s print manager?", opts: [
    { k: "A", t: "Temka (internal)", d: "Knows the business. No management experience.", set: { hire: "temka" }, val: 1, out: "👤 Temka starts on Monday. The workers are happy for him. In the first month, he finds it hard to tell his friends what to do.", concept: "Any choice can be right if you justify it against the person specification." },
    { k: "B", t: "Zaya (external)", d: "Three years as a manager. New to {B}.", set: { hire: "outside" }, val: 1, out: "🌍 Zaya brings a faster way to plan big orders. She needs three weeks to learn your machine. Temka is disappointed.", concept: "Any choice can be right if you justify it against the person specification." }
  ] },
  { id: "h12s6", type: "build", topic: "2.1", exam: true, cmd: "Explain", marks: 6, q: "Explain <b>one</b> advantage and <b>one</b> disadvantage to {B} of recruiting its new print manager internally.", slots: [
    { label: "Advantage: name it [k]", opts: ["The business already knows the worker's skills", "It brings new ideas from outside", "There are many people to choose from"] },

{ n: 13, code: "205683", img: "exam", topic: "Final", title: "The Exam Room", sub: "One full 8-mark (d) question", book: "📖 Coursebook pp. 56-63",
  terms: ["partnership", "private limited company", "unlimited liability", "limited liability"],
  steps: [
  { id: "h13s1", type: "story", title: "Forty million tögrög", text: S => `<p>🎉 Two years ago, you printed hoodies in your bedroom. Now {B} is a real <b>${ENT[S.vars.entity || "sole"]}</b>.</p><p>🏭 To open a workshop in Darkhan, {B} needs <b>40,000,000₮</b>.</p><p>🎨 Anu can put in 5,000,000₮. Uncle Bold will put in 30,000,000₮, but only if his own home and savings are safe.</p><p>🧑‍🏫 Mr. Chris: <i>"One last test. The (d) question is worth 8 marks. Two sides, then a decision with a NEW reason."</i></p>` },
  { id: "h13s2", type: "write", topic: "Final", exam: true, cmd: "Justify", marks: 8, q: "{B} needs 40,000,000₮ to grow. Explain <b>two</b> forms of business organisation {B} could use: a partnership and a private limited company. Which form should {B} choose? <b>Justify</b> your answer.",
    guide: ["Form 1: say what it is [k] + a fact about {B} [app] + so... [an].", "Form 2: the same three moves.", "Decision: which one, and WHY it is better than the other [eval]. Do not just repeat."],
    frame: ["A partnership is ... For {B}, ... so ...", "A private limited company is ... For {B}, ... so ...", "{B} should choose ... because ...", "This is better than ... because ..."],
    points: [
      { tag: "k", t: "Partnership is explained correctly (two or more owners; they share profit; unlimited liability)." },
      { tag: "k", t: "Private limited company is explained correctly (owned by shareholders; limited liability; shares not sold to the public)." },
      { tag: "app", t: "The partnership part uses a fact about {B} (Anu; her 5,000,000₮; her designs; the 40,000,000₮)." },
      { tag: "app", t: "The company part uses a fact about {B} (Uncle Bold; his 30,000,000₮; his home and savings; Darkhan)." },
      { tag: "an", t: "The partnership part has a consequence: 'so...' or 'which means...'." },
      { tag: "an", t: "The company part has a consequence." },
      { tag: "eval", t: "A clear decision: which form {B} should choose." },
      { tag: "eval", t: "The decision has a comparing reason that is NEW, not a repeat." }
    ],
    model: S => {
      const e = S.vars.entity || "sole";
      const now = e === "ltd" ? "{B} already chose this form, and the reasons are even stronger now" : e === "partner" ? "You and Anu are partners now, but two partners cannot raise 40,000,000₮ alone" : "As a sole trader, you would have to find all the money yourself";
      return `<p><b>Partnership.</b> Two or more people own the business together and share the profit, with unlimited liability [k]. Anu could become a partner and put in 5,000,000₮ and her design skills [app]. This means more capital and shared work, but both partners could lose their own things if the new workshop fails [an].</p>
<p><b>Private limited company.</b> The business is owned by shareholders who have limited liability [k]. Uncle Bold will invest 30,000,000₮ only if his own home and savings are safe [app]. So with shares, {B} gets most of the 40,000,000₮ without a bank loan, but the three shareholders must share the profit and agree on big decisions [an].</p>
<p><b>Decision:</b> {B} should choose the private limited company [eval]. ${now}. A partnership with Anu brings only 5,000,000₮ of the 40,000,000₮ needed, but the company brings 35,000,000₮. Limited liability also matters more now, because a second workshop in Darkhan is a bigger risk. The partnership would be better only if keeping full control mattered more than growing [eval].</p>`;
    },
    rules: ["(d) questions: up to 2 marks each for [k], [app], [an] and [eval].", "The decision must add something new. Repeating earlier points earns no [eval] marks.", "Any decision can earn full marks if it is justified. The model chooses the company; you may choose the partnership."] },
  { id: "h13s3", type: "story", title: "Show Mr. Chris", text: `<p>📓 Keep your notebook open at your 8-mark answer.</p><p>🧑‍🏫 Mr. Chris may check that your marks match your writing. Be honest: a Cambridge examiner will not be kind.</p><p>👉 Tap <b>Continue</b> to see your Founder's Report.</p>` }
  ] }
];

<script>
const KEY = GAME.key;
const MASTER = GAME.master;
let S = load() || fresh();
let ui = {};
let AC = null;
function tone(freqs, dur, type, vol){ if (S.mute) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t0 = AC.currentTime; freqs.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || "sine"; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0 + i * dur); g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + i * dur + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + (i + 1) * dur + 0.15); o.connect(g); g.connect(AC.destination); o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.2); }); } catch (e) {} }
const ding = () => tone([880, 1320], 0.09, "sine", 0.06), thud = () => tone([196], 0.14, "triangle", 0.05), fanfare = () => tone([523, 659, 784, 1047], 0.1, "sine", 0.05);
function fresh(){ return { name:"", val:10, ch:0, step:0, screen:"start", unlocked:{}, vars:Object.assign({}, GAME.vars0 || {}), res:{}, master:false, mute:false }; }
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = id => document.getElementById(id);
const fmt = n => { const r = Math.round(n*10)/10; return r.toLocaleString("en-US"); };
const money = n => "MNT " + Math.round(n).toLocaleString("en-US");
function val(x){ return typeof x === "function" ? x(S) : x; }
function esc(t){ return String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
function sub(t){ return String(t).replace(/\{B\}/g, esc(S.vars.brand || "your business")).replace(/\{N\}/g, esc(S.name || GAME.roleName || "Founder")); }
function gl(html){
  return sub(html).replace(/\[\[([^\]]+)\]\]/g, (m, w) => {
    const [term, label] = w.split("|");
    const k = Object.keys(GLOSSARY).find(g => g.toLowerCase() === term.toLowerCase());
    return k ? `<span class="term" data-act="term" data-term="${k}">${label || term}</span>` : (label || term);
  }).replace(/\[(k|app|an|eval)\]/g, (m, t) => `<span class="tag ${t}">${t}</span>`);

<div class="card"><h2>While you wait: key terms</h2><p class="small">Say the meaning, then tap to check.</p><div class="flip">${c.terms.map((t, i) => `<button data-act="flip" data-i="${i}">${ui.flip && ui.flip[i] ? `<b>${t}</b><br>${GLOSSARY[t]}` : `<b>${t}</b><br><span class="small">Tap to check</span>`}</button>`).join("")}</div><p class="small" style="margin-top:8px">📓 Copy any word you missed into your notebook, with its meaning.</p></div>
<div class="row"><button class="btn" data-act="tonext">${last ? "See my " + (GAME.reportName || "Founder's Report") + " →" : "Next →"}</button></div>`;
}
function topicMap(){
  const t = {}; Object.values(S.res).forEach(x => { if (!x.max) return; t[x.topic] = t[x.topic] || [0, 0]; t[x.topic][0] += x.earned; t[x.topic][1] += x.max; });
  return t;
}
const PATHS = GAME.paths;
function totals(){ let e = 0, m = 0, xe = 0, xm = 0; allSteps().forEach(st => { if (!st.marks) return; const r = S.res[st.id]; if (st.exam) { xm += st.marks; if (r) xe += r.earned; } else { m += st.marks; if (r) e += r.earned; } }); return { xe, xm, e, m }; }
function allSteps(){ return CHAPTERS.flatMap(c => c.steps); }
function reportScreen(){
  const t = topicMap(); const keys = GAME.topics, names = GAME.names;
  let rows = "", weak = [];
  keys.forEach(k => { if (!t[k]) return; const p = t[k][0] / t[k][1]; const c = p >= .75 ? "g" : p >= .5 ? "a" : "r"; if (c !== "g" && k !== "Final") weak.push(k + " " + names[k]); rows += `<tr><td>${k} ${names[k]}</td><td><div class="bar"><i class="${c}" style="width:${Math.round(p * 100)}%"></i></div></td><td style="text-align:right">${Math.round(p * 100)}%</td></tr>`; });
  const x = totals(), tot = x.xe + x.e, max = x.xm + x.m;
  const v = S.val, title = (GAME.tiers.find(t => v >= t[0]) || GAME.tiers[GAME.tiers.length - 1])[1];
  const path = Object.keys(PATHS).filter(k => S.vars[k]).map(k => `<li>${PATHS[k][S.vars[k]]}</li>`).join("");
  return `<div class="card cert"><div class="chips" style="justify-content:center"><span class="chip story">${GAME.reportName || "Founder's Report"}</span></div><div class="name">${esc(S.name || GAME.roleName || "Founder")}</div><p class="small">${GAME.reportSub} · ${esc(S.vars.brand || "")}</p><div class="scorebig">${fmt(tot)} / ${max}</div><p><b>Total score</b> · ${Math.round(tot / max * 100)}%</p><p>📝 Exam parts: <b>${fmt(x.xe)} of ${x.xm}</b> marks · ✔️ Quick checks: <b>${fmt(x.e)} of ${x.m}</b> points</p><p>${GAME.valIcon || "🥟"} ${GAME.valName || "Brand value"} <span class="earn">${fmt(v)}${GAME.valLong === undefined ? " million ₮" : GAME.valLong}</span> · ${title}</p><p class="small">📱 Show this screen to Mr. Chris.</p></div>
<div class="card"><h2>Your revision map</h2><table class="map">${rows}</table><p style="margin-top:10px">${weak.length ? `🎯 <b>Revise first:</b> ${weak.join(", ")}. Reread these topics in your coursebook tonight.` : "🎯 Strong on every topic. Next step: full past Paper 1 and Paper 2 questions."}</p></div>
<div class="card"><h2>Your path</h2><ul class="path">${path}</ul><p class="small">${GAME.pathNote || "Different choices lead to different numbers and endings. Play again later to try another path."}</p><div class="row"><button class="btn ghost" data-act="reset">Play again</button></div></div>`;
}
function showMenu(){
  const cr = Object.values(CREDITS).filter((x, i, a) => a.indexOf(x) === i).map(x => `<li>${x}</li>`).join("");
  $("pop").innerHTML = `<div class="pop"><b>Menu</b><p class="small">Progress is saved on this device.</p><div class="row"><button class="btn teal" data-act="myscore">📱 Show my score now</button></div><div class="row"><button class="btn ghost" data-act="reset">Start again</button><button class="btn" data-act="popclose">Close</button></div><p class="small" style="margin-top:10px"><b>Photo credits</b></p><ul class="small">${cr}</ul><p class="small">All businesses, people and figures in the story are fictional.</p></div>`;
}
function showCase(){ $("pop").innerHTML = `<div class="pop case"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>📄 ${GAME.caseTitle || "Case study"}</b><button class="btn" data-act="popclose">Close ✕</button></div>${gl(val(GAME.caseFile))}<div class="row"><button class="btn" data-act="popclose">Close ✕</button></div></div>`; }
function showScore(){ const x = totals(); $("pop").innerHTML = `<div class="pop" style="text-align:center"><b>${esc(S.name || GAME.roleName || "Founder")}</b> · ${esc(S.vars.brand || "")}<div class="scorebig" style="margin:8px 0">${fmt(x.xe + x.e)} / ${x.xm + x.m}</div><p class="small">Score so far · reached ${GAME.chapterWord || "Chapter"} ${S.ch + 1} of ${CHAPTERS.length}<br>Exam parts ${fmt(x.xe)} of ${x.xm} · Quick checks ${fmt(x.e)} of ${x.m}</p><div class="row" style="justify-content:center"><button class="btn" data-act="popclose">Close</button></div></div>`; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "myscore") return showScore();
  if (a === "case") return showCase();
  if (a === "mute") { S.mute = !S.mute; save(); return header(); }
  if (a === "key") {
    const k = b.dataset.k; ui.code = ui.code || ""; ui.codeErr = false;
    if (k === "⌫") ui.code = ui.code.slice(0, -1);
    else if (k === "✓") {
      if (ui.code === MASTER) S.master = true;
      if (ui.code === ch().code || ui.code === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); fanfare(); return render(); }
      ui.codeErr = true; ui.code = ""; thud();
    } else if (ui.code.length < 6) ui.code += k;
    return render();
  }
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || [];
    if (ui.tries.includes(i)) return;
    ui.tries.push(i);
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || [];
    if (raw.trim() === "") return;
    ui.tries.push(raw);
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
</script>
